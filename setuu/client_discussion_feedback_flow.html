<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Needs Discussion - Setuu Engineering</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Merriweather:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="tailwind.config.js"></script>
<script src="components.js"></script></head>
<body class="bg-surface text-on-surface font-body-md h-screen flex overflow-hidden selection:bg-secondary-container selection:text-on-secondary-container pt-[64px]">
<!-- SideNavBar (Desktop) -->
<setuu-sidebar role="client"></setuu-sidebar>
<!-- Main Content Area -->
<div class="flex flex-col flex-grow md:ml-sidebar-width h-full overflow-hidden relative">
<!-- TopNavBar -->
<setuu-header></setuu-header>
<!-- Canvas -->
<main class="lg:ml-sidebar-width flex-grow overflow-hidden relative flex flex-col md:flex-row bg-background">
<!-- Background Update Feed (Simulated underneath the overlay) -->
<div class="flex-grow overflow-y-auto p-gutter md:p-margin-desktop bg-surface-container-lowest opacity-40 transition-opacity pointer-events-none filter blur-[2px] hidden lg:block">
<div class="max-w-4xl mx-auto space-y-6">
<div class="border border-outline-variant bg-surface shadow-sm p-6 relative">
<div class="flex justify-between items-start mb-4">
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface font-bold">Turbine Housing Alignment</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Project: Alpha Sector Power Plant - Phase 3</p>
</div>
<span class="px-3 py-1 bg-tertiary-container text-on-tertiary-container font-label-md text-label-md border border-tertiary-fixed-dim">INSPECTION LOG</span>
</div>
<div class="w-full h-64 bg-surface-container-high border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-[48px]">image</span>
</div>
</div>
</div>
</div>
<!-- Discussion Overlay Panel -->
<div class="absolute inset-0 z-20 flex justify-end bg-on-background/20 backdrop-blur-sm">
<aside class="w-full md:w-[600px] bg-surface h-full shadow-[-4px_0_24px_rgba(0,0,0,0.1)] border-l border-outline-variant flex flex-col animate-[slideInRight_0.3s_ease-out]">
<!-- Panel Header -->
<div class="flex items-center justify-between px-6 py-5 border-b border-outline-variant bg-surface-container-lowest sticky top-0 z-10">
<div>
<h2 class="font-headline-sm text-headline-sm font-bold text-primary">Initiate Discussion</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 uppercase tracking-wider">Project Update #1042</p>
</div>
<button aria-label="Close panel" class="p-2 text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Panel Content -->
<div class="flex-grow overflow-y-auto">
<!-- Media Context -->
<div class="relative w-full h-72 border-b border-outline-variant bg-surface-container-highest group">
<img alt="Turbine alignment detail" class="w-full h-full object-cover" data-alt="A highly detailed close-up photograph of heavy industrial machinery, specifically a massive metallic steel turbine housing being assembled. Sharp focus on structural bolts and alignment seams. Cool, precise factory lighting highlighting the metallic textures. Industrial clinical aesthetic, high contrast." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUQpLNwmIugkr8qetUwptP6AC-P7sFE3EEguyyTLSSTriYUkOZjatRsGdUDGgb6fwa58q0wucSZzBczShAUHgkETq9_CFsb1xjLiVCcHD_JAYGfNnTjuMy812VxkT8j5DzYSL8KDF2EfswaTIH2md2JHZIjorSz20-HdUqWgWBhMMX9Ee6rfYHP6SukVNqU3_HkxvZFYGESqKC8Az6NkEU0bC0aovHtVoY30IzYF_V-_pfWio9FYkxqg"/>
<!-- Point of Interest Marker -->
<div class="absolute top-[45%] left-[60%] -translate-x-1/2 -translate-y-1/2 group-hover:scale-110 transition-transform cursor-pointer">
<div class="relative w-8 h-8 flex items-center justify-center">
<div class="absolute inset-0 border-2 border-error animate-ping opacity-75"></div>
<div class="relative w-6 h-6 bg-error shadow-md border-2 border-surface flex items-center justify-center">
<div class="w-2 h-2 bg-on-error"></div>
</div>
</div>
<div class="absolute top-full left-1/2 -translate-x-1/2 mt-2 bg-on-surface text-surface font-label-sm text-label-sm px-2 py-1 shadow-lg whitespace-nowrap border border-outline-variant hidden group-hover:block"> Seam Gap Variance </div>
</div>
<!-- Telemetry Watermark -->
<div class="absolute bottom-4 right-4 bg-on-surface/80 backdrop-blur-md px-3 py-2 border border-outline/30 text-right">
<div class="font-label-sm text-label-sm text-surface opacity-90 tracking-widest">N 45°31'12" W 122°40'55"</div>
<div class="font-label-sm text-label-sm text-surface opacity-90 tracking-widest mt-1">2023.10.24 :: 14:32:00Z</div>
</div>
</div>
<!-- Form Area -->
<div class="p-6 space-y-6">
<!-- Subject -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="subject">Subject of Concern</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant px-4 py-2 font-body-md text-body-md text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="subject" placeholder="e.g., Tolerance deviation on lateral seam" type="text" value="Tolerance deviation detected on primary joint"/>
</div>
<!-- Priority -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-3">Priority Level</label>
<div class="grid grid-cols-3 gap-3">
<label class="cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="routine"/>
<div class="text-center py-2 px-3 border border-outline-variant font-label-md text-label-md text-on-surface-variant peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary hover:bg-surface-container-high transition-colors"> ROUTINE </div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="priority" type="radio" value="urgent"/>
<div class="text-center py-2 px-3 border border-outline-variant font-label-md text-label-md text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary hover:bg-surface-container-high transition-colors relative overflow-hidden"> URGENT <!-- Progress bar indicator -->
<div class="absolute bottom-0 left-0 h-[4px] w-full bg-tertiary hidden peer-checked:block"></div>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="critical"/>
<div class="text-center py-2 px-3 border border-outline-variant font-label-md text-label-md text-on-surface-variant peer-checked:bg-error-container peer-checked:text-on-error-container peer-checked:border-error hover:bg-surface-container-high transition-colors"> CRITICAL </div>
</label>
</div>
</div>
<!-- Details -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="details">Specific Detail / Requirement</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant px-4 py-3 font-body-md text-body-md text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-colors resize-none" id="details" placeholder="Detail the specific engineering requirements or observations..." rows="5">The lateral seam gap appears to exceed the 2.5mm tolerance specified in blueprint TRB-409. Requesting secondary laser measurement confirmation before proceeding with torque sequence.</textarea>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-2 text-right">Markdown supported</p>
</div>
</div>
</div>
<!-- Panel Footer / Actions -->
<div class="p-6 border-t border-outline-variant bg-surface-container-lowest flex justify-end gap-3 sticky bottom-0">
<button class="px-6 py-2 border border-outline-variant text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-colors active:scale-95"> Cancel </button>
<button class="px-6 py-2 bg-primary text-on-primary font-label-md text-label-md shadow-sm hover:bg-primary-container hover:text-on-primary-container border border-transparent transition-colors active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">forum</span> Start Thread </button>
</div>
</aside>
</div>
</main>
</div>
<style> @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } } </style>
<script src="setuu.js"></script>
</body></html>

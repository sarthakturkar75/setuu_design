<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Setuu - Password Reset</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="tailwind.config.js"></script>
    <script src="setuu.js"></script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
    <main class="w-full max-w-[480px]">
        <div class="mb-12 flex justify-center">
            <h1 class="text-display-lg font-display-lg font-bold tracking-tight text-primary">SETUU</h1>
        </div>
        <div class="bg-surface-container-lowest border border-outline-variant p-8 md:p-12 shadow-sm">
            <h2 class="text-headline-md font-headline-md font-bold mb-2">Reset Password</h2>
            <p class="text-body-md text-on-surface-variant mb-8">Enter your new secure password below. It must be at least 12 characters and contain special symbols.</p>
            
            <form id="resetForm" class="space-y-6" action="#">
                <div class="space-y-1">
                    <label class="block text-label-md font-label-md uppercase tracking-wider text-on-surface-variant" for="new-password">New Password</label>
                    <input class="w-full bg-surface-container border border-outline-variant px-4 py-3 text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="new-password" placeholder="••••••••••••" required="" type="password"/>
                </div>
                <div class="space-y-1">
                    <label class="block text-label-md font-label-md uppercase tracking-wider text-on-surface-variant" for="confirm-password">Confirm Password</label>
                    <input class="w-full bg-surface-container border border-outline-variant px-4 py-3 text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="confirm-password" placeholder="••••••••••••" required="" type="password"/>
                </div>
                <button class="w-full bg-primary text-on-primary font-label-md uppercase tracking-wider py-4 hover:opacity-90 transition-opacity flex justify-center items-center gap-2 mt-4" type="submit">
                    Reset Password
                </button>
            </form>
        </div>
        <div class="mt-8 text-center">
            <a class="text-label-md font-label-md text-primary hover:underline uppercase tracking-wider flex items-center justify-center gap-1" href="login.html">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span> Return to Login
            </a>
        </div>
    </main>
</body>
</html>

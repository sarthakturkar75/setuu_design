<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Delivery Proof Upload Dropzone</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Merriweather:wght@400;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#faf9f4',
            'surface-dim': '#dbdad5',
            'surface-container': '#efeee9',
            'on-surface': '#1b1b1a',
            'on-surface-variant': '#474746',
            outline: '#777776',
            'outline-variant': '#c8c7c5',
            primary: '#00213c',
            'on-primary': '#ffffff',
            secondary: '#1f2b32',
            'sky-wash': 'rgba(14, 165, 233, 0.1)',
            'sky-border': '#38bdf8',
            warning: '#eab308',
            disabled: '#8ca1ad',
          },
          fontFamily: {
            merriweather: ['Merriweather', 'serif'],
            inter: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          borderRadius: {
            '8xl': '8px',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    .font-merriweather { font-family: 'Merriweather', serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-gray-400 font-inter text-on-surface h-screen w-screen flex items-center justify-center overflow-hidden">
<!-- Background Context (Blurred) -->
<div class="absolute inset-0 z-0 bg-surface/50 backdrop-blur-sm pointer-events-none"></div>
<!-- BEGIN: Modal Overlay -->
<div class="relative z-10 w-full max-w-2xl bg-surface rounded-[8px] shadow-2xl overflow-hidden flex flex-col">
<!-- BEGIN: Modal Header -->
<header class="flex items-start justify-between px-6 pt-6 pb-4 border-b border-outline-variant">
<div>
<h2 class="text-xl font-bold font-merriweather text-on-surface mb-1">Upload Delivery Proof</h2>
<p class="text-sm text-on-surface-variant font-inter">Submit signed manifests or photographic evidence.</p>
</div>
<button aria-label="Close modal" class="p-2 text-on-surface-variant hover:text-on-surface rounded-full transition-colors">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
</header>
<!-- END: Modal Header -->
<!-- BEGIN: Modal Body -->
<main class="p-6 flex flex-col gap-6">
<!-- BEGIN: Dropzone Area -->
<div class="border-2 border-dashed border-sky-border bg-sky-wash rounded-[8px] p-10 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-sky-wash/80 transition-colors">
<div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm mb-4 text-primary">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
<polyline points="17 8 12 3 7 8"></polyline>
<line x1="12" x2="12" y1="3" y2="15"></line>
</svg>
</div>
<h3 class="font-semibold text-on-surface text-base mb-1">Drag &amp; Drop documents here</h3>
<p class="text-on-surface-variant text-sm mb-4">or click to browse from your device</p>
<span class="inline-block px-3 py-1 bg-surface-container border border-outline-variant rounded-full text-xs font-mono text-on-surface-variant">
          PDF, JPG, PNG up to 50MB
        </span>
</div>
<!-- END: Dropzone Area -->
<!-- BEGIN: File Upload Status -->
<div class="border border-outline-variant rounded-[8px] p-4 bg-surface-container-low flex items-start gap-4">
<div class="w-10 h-10 bg-amber-100 rounded flex items-center justify-center shrink-0 text-amber-700">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
<polyline points="14 2 14 8 20 8"></polyline>
<line x1="16" x2="8" y1="13" y2="13"></line>
<line x1="16" x2="8" y1="17" y2="17"></line>
<polyline points="10 9 9 9 8 9"></polyline>
</svg>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between mb-2">
<span class="font-mono text-sm font-medium text-on-surface truncate">Delivery_Manifest_992.pdf</span>
<span class="text-sm font-medium text-warning flex items-center gap-2">
              Scanning...
              <button aria-label="Cancel upload" class="text-on-surface-variant hover:text-on-surface ml-2">
<svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
</span>
</div>
<!-- Progress Bar -->
<div class="h-1.5 w-full bg-outline-variant rounded-full overflow-hidden mb-2">
<div class="h-full bg-warning w-1/3 rounded-full"></div>
</div>
<div class="flex items-center gap-1.5 text-xs text-on-surface-variant">
<svg fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
</svg>
<span>ClamAV edge function verifying file integrity.</span>
</div>
</div>
</div>
<!-- END: File Upload Status -->
</main>
<!-- END: Modal Body -->
<!-- BEGIN: Modal Footer -->
<footer class="px-6 py-4 border-t border-outline-variant bg-surface-container flex items-center justify-end gap-4 rounded-b-[8px]">
<button class="px-4 py-2 font-semibold text-on-surface hover:text-primary transition-colors text-sm">
        Cancel
      </button>
<button class="px-4 py-2 font-semibold text-white bg-disabled rounded-[8px] flex items-center gap-2 text-sm cursor-not-allowed opacity-80" disabled="">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
        Submit Proof
      </button>
</footer>
<!-- END: Modal Footer -->
</div>
<!-- END: Modal Overlay -->
</body></html>

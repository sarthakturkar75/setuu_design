<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Setuu Enterprise - Topbar</title>

                      "on-primary-fixed": "#001d35",

                      "background": "#faf9f4",

                      "on-secondary-fixed-variant": "#004c6b",
                      "surface-dim": "#dbdad5",

                      "secondary-fixed-dim": "#88cffc",
                      "inverse-on-surface": "#f2f1ec",
                      "on-secondary-fixed": "#001e2d",

                      "surface-container": "#efeee9",

                    "sidebar-width": "280px",

              "fontFamily": {

<body class="bg-background font-body text-on-background h-screen overflow-hidden flex flex-col">
<!-- TopAppBar -->
<header class="bg-white/85 dark:bg-[#121a21]/85 backdrop-blur-md border-b border-outline-variant/20 dark:border-outline/20 shadow-sm fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile md:px-margin-desktop w-full h-16">
<!-- Left Side: Breadcrumb & Switcher -->
<div class="flex items-center gap-4 flex-1">
<button class="text-primary dark:text-secondary-fixed hover:bg-surface-container-high/50 transition-colors p-2 rounded-full active:scale-95 transition-transform hidden lg:block">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<nav aria-label="Breadcrumb" class="hidden md:flex items-center gap-2 text-sm text-on-surface-variant font-medium">
<a class="hover:text-primary transition-colors" href="#">Projects</a>
<span class="material-symbols-outlined text-sm">chevron_right</span>
<div class="relative group">
<button class="flex items-center gap-1 hover:text-primary transition-colors text-primary font-semibold">
                        Alpha Centauri Plant
                        <span class="material-symbols-outlined text-sm">arrow_drop_down</span>
</button>
<!-- Dropdown Content (Hidden by default) -->
<div class="absolute left-0 mt-2 w-48 bg-surface border border-outline-variant rounded-md shadow-lg hidden group-hover:block z-50">
<ul class="py-1">
<li><a class="block px-4 py-2 text-sm text-on-surface hover:bg-surface-container-high" href="#">Beta Site Construction</a></li>
<li><a class="block px-4 py-2 text-sm text-on-surface hover:bg-surface-container-high" href="#">Gamma Facility</a></li>
</ul>
</div>
</div>
<span class="material-symbols-outlined text-sm">chevron_right</span>
<span class="text-primary font-bold">Materials</span>
</nav>
</div>
<!-- Center: Search -->
<div class="flex-1 flex justify-center max-w-md hidden sm:flex">
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">search</span>
</div>
<input class="block w-full pl-10 pr-3 py-1.5 border border-outline-variant rounded-full leading-5 bg-surface-container-low text-on-surface placeholder-outline focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-colors duration-200" placeholder="Search milestones, materials, or files..." type="text"/>
</div>
</div>
<!-- Right Side: Utilities -->
<div class="flex items-center gap-4 flex-1 justify-end">
<!-- Offline Sync Indicator -->
<div class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-low border border-outline-variant/50">
<span class="material-symbols-outlined text-[18px] text-[#0284C7]" style="font-variation-settings: 'FILL' 1;">cloud_done</span>
<span class="font-label text-label-sm text-[#0284C7]">SYNCED</span>
</div>
<!-- Notifications -->
<button class="relative p-2 text-on-surface-variant hover:bg-surface-container-high/50 rounded-full transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="absolute top-1 right-1 block h-2.5 w-2.5 rounded-full bg-error ring-2 ring-surface"></span>
</button>
<!-- User Profile -->
<button class="flex items-center gap-2 hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<div class="h-8 w-8 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant flex items-center justify-center">
<img class="h-full w-full object-cover" data-alt="A professional headshot of a diverse project manager in their late 30s, smiling subtly, wearing a smart casual blazer. The background is a slightly blurred modern corporate office setting with natural light coming through a window. The lighting is soft and even, highlighting their features. The overall mood is approachable, competent, and reliable, fitting for an industrial project management SaaS platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBaMKU6JDe9wcE7LgGNZ_XJ3bPajLYG52bQ4iZb0TnQFH2B5aj8kHffWWvPN1WNGF6JqI02zg8RF5oGjnoVi8XUifp8YTYC_V-UVDioUHgzb7GoADvRM5a5tCmICwmytGb3e4ccbzVE6qi-obSVjmM8N4p7TVpdduBX2QOfcXKgQJ-9wNNzj5LsIdXbsUxOc2IZMdHbzaVbXvqfMh4rLgbj1OFnMYzxgcnu-bL23zl0nB10eD9e2YFB"/>
</div>
</button>
</div>
</header>
<!-- Main Content Canvas (Empty for Isolation) -->
<main class="flex-1 mt-16 p-6">
<!-- Content would go here -->
</main>
</body></html>

<meta charset="utf-8">

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background min-h-screen text-on-surface font-body antialiased flex flex-col justify-start pt-12">
<!-- TopNavBar Component -->
<header class="bg-white/85 backdrop-blur-xl border-b border-outline-variant/40 shadow-glass-inner shadow-sm flex justify-between items-center w-full px-8 h-20 z-40 sticky top-0 transition-all duration-300">
<!-- Left: Co-branding -->
<div class="flex items-center gap-6">
<!-- Setuu Logo -->
<div class="flex items-center h-10"><img src="https://lh3.googleusercontent.com/aida/AP1WRLure7wf5bUVGTUbG5jJACCYk6a6EGkSVlgsDU1b_RWnW3LbzW6_BCLfaqJZ51Z7lHAVRqzlkWW8Ofxt5_TfTPAMaP7nW1mh07hTHoS0hF7n-EzT0zkMH0eVgG7hO1Ta71qxynom3njj207wfbWHwdgHw1ebEdq8cOHn61KUJhxWS9gYa32sm0_mvjMVcMN3c41MXgiS9JQisOZYTh64pQrl5LNvwiKguIB2H8o10sjJNLmjhFGYI4p083A" alt="Setuu Enterprise Logo" class="h-full w-auto object-contain"></div>
<!-- Divider -->
<div class="h-8 w-px bg-outline-variant/50 hidden md:block"></div>
<!-- Client Logo Placeholder -->
<div class="hidden md:flex items-center gap-3 opacity-80">
<img alt="Client Logo" class="w-8 h-8 rounded-sm object-contain mix-blend-multiply" data-alt="A sleek, modern corporate logo icon featuring geometric shapes in deep slate and sky blue, representing a high-end construction or engineering firm. The logo should look professional, vector-style, and clean against a light background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-baD_O7KO3TX5JCVg8c39yGEl1W8IYifO-uknpgHXQBBALffu8Z48iqhVS6fxnmJ3zej75JZf8L6KhmCkbI00kdxSA1yeOnzUXF7cCNbEtmojP4FOL-Qz8hvaIFEHM3SQlcHHtdgZLoZtZ9kjG8T1GVnnL_WCZmeY8zMceGO3S_6zuoDP-XW2J2Sc3l2G_kGS60L7iSfFLIn5K9cwe9OxMvh1Nw4Te_cbunPHkLfyLgdAC8vKB-Ps">
<span class="font-body font-medium text-sm text-on-surface-variant tracking-wide uppercase">Acme Corp</span>
</div>
</div>
<!-- Center: Search -->
<div class="flex-1 max-w-2xl mx-8 hidden lg:block">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">search</span>
</div>
<input class="block w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/60 rounded-lg text-sm text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm group-hover:shadow-md" placeholder="Search projects, documents, or audit logs..." type="text">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center">
<span class="font-label text-xs text-outline bg-surface-container px-2 py-1 rounded">⌘K</span>
</div>
</div>
</div>
<!-- Right: Actions & Profile -->
<div class="flex items-center gap-5">
<!-- Primary Action -->
<button class="hidden md:flex items-center gap-2 bg-semantic-verification hover:bg-semantic-verification/90 text-white px-5 py-2.5 rounded-lg shadow-sm transition-colors active:scale-95 font-body font-medium text-sm">
<span class="material-symbols-outlined text-lg">description</span>
                Generate Executive Report
            </button>
<div class="h-8 w-px bg-outline-variant/50 hidden md:block"></div>
<!-- Notifications -->
<button class="p-2 text-on-surface-variant hover:text-primary hover:bg-surface-container-low rounded-full transition-colors group">
<span class="material-symbols-outlined">help_outline</span>
</button>
<button class="p-2 text-on-surface-variant hover:text-primary hover:bg-surface-container-low rounded-full transition-colors group">
<span class="material-symbols-outlined">settings</span>
</button><button class="relative p-2 text-on-surface-variant hover:text-primary hover:bg-surface-container-low rounded-full transition-colors group">
<span class="material-symbols-outlined">notifications</span>
<span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-error rounded-full border-2 border-surface-container-lowest"></span>
</button>
<!-- Profile Avatar -->
<button class="flex items-center gap-3 pl-2 focus:outline-none">
<div class="w-10 h-10 rounded-full border border-outline-variant/50 overflow-hidden shadow-sm hover:shadow transition-shadow">
<img alt="Client Profile Avatar" class="w-full h-full object-cover" data-alt="A professional headshot of a female executive in her 40s, wearing a tailored navy blazer against a neutral corporate background. She has a confident, approachable expression, suitable for a high-end SaaS dashboard avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC36L6xoJ_6oak3czavjl-Uw6Q51KJ12VaVCcuJD-xpJLigXOuNI3WPQcwzwcrG2LGaa9C2dyQrydpkGO450pVlwgOMhBtaNvuHIPMbpXHtEEzuZRpsKdyjiDa9K2GPxWdR2wdKkE8RMOIY3jgSXEQVZKMAswAFZ6PpNRQNt_J89T_6jtLzfXqgYZ1nbhbGY2IIVIlIQcmgu2zDR4LZDLiBkfjKIAWql4DXFJq7cVhlfkS4YbwtHZ6i">
</div>
</button>
</div>
</header>


</body></html>

<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Setuu Enterprise - Client Onboarding</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Merriweather:wght@400;700;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#efeee9",
                        "outline-variant": "#c3c6ce",
                        "secondary": "#00658d",
                        "surface-container-low": "#f5f4ef",
                        "on-tertiary-fixed-variant": "#004c6b",
                        "background": "#faf9f4",
                        "on-primary": "#ffffff",
                        "outline": "#73777e",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#c6e7ff",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e3e3de",
                        "on-primary-container": "#6f89a9",
                        "tertiary-container": "#002233",
                        "primary-fixed": "#d1e4ff",
                        "on-primary-fixed": "#001d35",
                        "surface-bright": "#faf9f4",
                        "surface-tint": "#46607e",
                        "on-error": "#ffffff",
                        "surface": "#faf9f4",
                        "primary": "#000815",
                        "on-surface": "#1b1c19",
                        "on-tertiary-container": "#0090c7",
                        "on-secondary-fixed": "#001e2d",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#1b1c19",
                        "surface-variant": "#e3e3de",
                        "inverse-on-surface": "#f2f1ec",
                        "inverse-surface": "#30312e",
                        "on-secondary": "#ffffff",
                        "primary-container": "#00213c",
                        "secondary-container": "#8ad1ff",
                        "on-secondary-fixed-variant": "#004c6b",
                        "secondary-fixed": "#c6e7ff",
                        "on-tertiary-fixed": "#001e2d",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#aec9eb",
                        "on-surface-variant": "#43474d",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#82cfff",
                        "on-secondary-container": "#005a7f",
                        "primary-fixed-dim": "#aec9eb",
                        "tertiary": "#00080f",
                        "secondary-fixed-dim": "#88cffc",
                        "on-primary-fixed-variant": "#2e4965",
                        "surface-dim": "#dbdad5",
                        "surface-container-high": "#e9e8e3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Merriweather", "serif"],
                        "display": ["Merriweather", "serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["JetBrains Mono", "monospace"]
                    }
                },
            },
        }
    </script>
<style>
        /* Material Symbols utility */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill-1 {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom Stepper Line styling */
        .stepper-line {
            position: absolute;
            top: 50%;
            left: calc(50% + 20px);
            right: calc(-50% + 20px);
            height: 2px;
            background-color: #e3e3de; /* surface-variant */
            z-index: 0;
            transform: translateY(-50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col pt-safe pb-safe md:hidden">
<!-- TopAppBar Shell Suppressed because this is a transactional Onboarding Flow. -->
<!-- Header Area -->
<header class="px-4 py-6 bg-surface-container-lowest border-b border-surface-variant z-10 sticky top-0 flex items-center justify-between shadow-sm">
<h1 class="font-headline text-2xl font-bold text-primary tracking-tight">Client Onboarding</h1>
<button aria-label="Close Onboarding" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative">
<!-- Stepper Indicator -->
<div class="px-4 py-6 bg-surface-container-lowest z-0 shadow-sm mb-4">
<div class="flex justify-between relative w-full px-2">
<!-- Step 1: Active -->
<div class="flex flex-col items-center relative z-10 w-1/3">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label text-sm font-bold shadow-md border-2 border-surface-container-lowest">
                        1
                    </div>
<span class="font-label text-xs mt-2 text-primary text-center font-semibold">Org Details</span>
<div class="stepper-line"></div>
</div>
<!-- Step 2: Pending -->
<div class="flex flex-col items-center relative z-10 w-1/3">
<div class="w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-label text-sm border-2 border-surface-container-lowest">
                        2
                    </div>
<span class="font-label text-xs mt-2 text-on-surface-variant text-center opacity-70">Industrial Sector</span>
<div class="stepper-line"></div>
</div>
<!-- Step 3: Pending -->
<div class="flex flex-col items-center relative z-10 w-1/3">
<div class="w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-label text-sm border-2 border-surface-container-lowest">
                        3
                    </div>
<span class="font-label text-xs mt-2 text-on-surface-variant text-center opacity-70">Configuration</span>
</div>
</div>
</div>
<!-- Form Canvas -->
<div class="flex-1 px-4 pb-24 overflow-y-auto space-y-6">
<div class="bg-surface-container-lowest rounded-lg p-5 shadow-sm border border-outline-variant/30 flex flex-col gap-5">
<h2 class="font-headline text-lg font-bold text-primary mb-1">Organization Details</h2>
<!-- Field: Organization Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-[11px] text-on-surface-variant uppercase tracking-wider font-semibold" for="org_name">Organization Name *</label>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-md px-4 py-3 text-on-surface font-body text-sm focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all placeholder:text-outline" id="org_name" name="org_name" placeholder="Enter legally registered name" type="text">
</div>
<!-- Field: Registration ID (JetBrains Mono) -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-[11px] text-on-surface-variant uppercase tracking-wider font-semibold" for="reg_id">Registration ID *</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]">badge</span>
</span>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-md pl-10 pr-4 py-3 text-on-surface font-label text-sm focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all placeholder:text-outline/70 placeholder:font-body" id="reg_id" name="reg_id" placeholder="e.g. TAX-992-01A" type="text">
</div>
<p class="font-body text-xs text-outline mt-1">Must match official industrial documentation.</p>
</div>
<!-- Field: Head Office Address -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-[11px] text-on-surface-variant uppercase tracking-wider font-semibold" for="head_office">Head Office Address</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant/50 rounded-md px-4 py-3 text-on-surface font-body text-sm focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all resize-none placeholder:text-outline" id="head_office" name="head_office" placeholder="Primary physical location for site audits..." rows="3"></textarea>
</div>
</div>
<!-- Upload Dropzone: Logo -->
<div class="bg-surface-container-lowest rounded-lg p-5 shadow-sm border border-outline-variant/30 flex flex-col gap-4">
<div class="flex justify-between items-center">
<h3 class="font-label text-[11px] text-on-surface-variant uppercase tracking-wider font-semibold">Corporate Logo</h3>
<span class="font-label text-[10px] text-outline bg-surface-container rounded-sm px-2 py-0.5">Optional</span>
</div>
<div class="border-2 border-dashed border-outline-variant rounded-lg p-6 flex flex-col items-center justify-center bg-surface-container-lowest hover:bg-surface-container-low transition-colors cursor-pointer group relative overflow-hidden" id="upload-dropzone">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-3 group-hover:bg-primary-container transition-colors group-hover:text-on-primary-container text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">cloud_upload</span>
</div>
<p class="font-body text-sm font-medium text-primary mb-1">Tap to upload logo</p>
<p class="font-label text-xs text-outline text-center">SVG, PNG, JPG (Max 5MB)</p>
<!-- Decorative subtle grid background for industrial feel -->
<div class="absolute inset-0 opacity-[0.02] pointer-events-none" style="background-image: radial-gradient(#1b1c19 1px, transparent 1px); background-size: 16px 16px;"></div>
</div>
</div>
</div>
<!-- Fixed Action Area (Bottom) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-variant p-4 pb-8 flex gap-3 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-20">
<button class="flex-1 py-3.5 px-4 rounded-lg bg-transparent border border-outline-variant text-on-surface-variant font-body font-semibold text-sm active:bg-surface-container-low transition-colors text-center shadow-sm" type="button">
                Cancel
            </button>
<button class="flex-[2] py-3.5 px-4 rounded-lg bg-primary-container text-on-primary-container font-body font-semibold text-sm active:scale-[0.98] transition-transform shadow-md flex items-center justify-center gap-2" type="button">
<span>Next: Industrial Sector</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</main>
<!-- BottomNavBar and SideNav suppressed per rule: Transactional Onboarding Flow -->
<script>
        // Simple interaction for dropzone to simulate tap state
        const dropzone = document.getElementById('upload-dropzone');
        if(dropzone) {
            dropzone.addEventListener('touchstart', () => {
                dropzone.classList.add('bg-surface-container-low', 'border-primary-container');
                dropzone.classList.remove('border-outline-variant');
            });
            dropzone.addEventListener('touchend', () => {
                dropzone.classList.remove('bg-surface-container-low', 'border-primary-container');
                dropzone.classList.add('border-outline-variant');
            });
        }
    </script>
</body></html>

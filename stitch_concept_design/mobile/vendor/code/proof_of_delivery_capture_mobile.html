<script>
        // Simulate tap-to-focus animation
        const mainView = document.querySelector('main');
        const reticle = document.getElementById('focus-reticle');

        mainView.addEventListener('click', (e) => {
            // Ignore clicks on buttons inside main
            if(e.target.closest('button')) return;

            const rect = mainView.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Update reticle position
            reticle.style.left = `${x}px`;
            reticle.style.top = `${y}px`;
            reticle.style.transform = `translate(-50%, -50%) scale(1.2)`;
            
            // Trigger animation
            requestAnimationFrame(() => {
                reticle.style.opacity = '1';
                reticle.style.transform = `translate(-50%, -50%) scale(1)`;
                reticle.style.borderColor = '#0284C7'; // Sky blue active semantic color
                
                setTimeout(() => {
                    reticle.style.opacity = '0';
                    setTimeout(() => {
                         reticle.style.borderColor = 'rgba(255,255,255,0.4)'; // Reset
                    }, 300);
                }, 800);
            });
        });
    </script>

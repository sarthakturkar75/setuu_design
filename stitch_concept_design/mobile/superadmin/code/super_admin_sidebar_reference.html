<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Super Admin Navigation Drawer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "secondary-container": "#8ad1ff",
                        "inverse-on-surface": "#f2f1ec",
                        "on-tertiary-fixed-variant": "#004c6b",
                        "tertiary-container": "#002233",
                        "surface-container-high": "#e9e8e3",
                        "primary": "#000815",
                        "on-primary-fixed-variant": "#2e4965",
                        "error": "#ba1a1a",
                        "inverse-surface": "#30312e",
                        "surface-container-highest": "#e3e3de",
                        "tertiary-fixed": "#c6e7ff",
                        "on-surface-variant": "#43474d",
                        "primary-fixed-dim": "#aec9eb",

                    "spacing": {
                        "unit": "4px",
                        "gutter-md": "24px",
                        "margin-mobile": "16px",
                        "margin-tablet": "24px",
                        "margin-desktop": "32px",
                        "sidebar-width": "280px",
                        "rail-width": "72px"
                    },
                    "fontFamily": {
                        "headline": ["Merriweather"],
                        "display": ["Merriweather"],
                        "body": ["Inter"],
                        "label": ["JetBrains Mono"]

                    "fontSize": {

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen relative overflow-hidden">
<!-- Mock Background App Content -->
<div class="h-full w-full flex flex-col pt-16 px-4">
<header class="fixed top-0 left-0 w-full h-16 bg-surface/85 backdrop-blur-md border-b border-outline-variant/20 flex items-center justify-between px-4 z-10">
<div class="flex items-center gap-3">
<button class="p-2 text-on-surface"><span class="material-symbols-outlined">menu</span></button>
<h1 class="font-headline text-headline-sm text-on-surface">Audit Logs</h1>
</div>
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label">SA</div>
</header>
<main class="flex-1 mt-4 space-y-4">
<div class="h-32 bg-surface-container rounded-lg border border-outline-variant animate-pulse"></div>
<div class="h-64 bg-surface-container rounded-lg border border-outline-variant animate-pulse"></div>
<div class="h-32 bg-surface-container rounded-lg border border-outline-variant animate-pulse"></div>
</main>
</div>
<!-- Scrim Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-on-background/40 z-40 transition-opacity"></div>
<!-- Navigation Drawer (Open State on Mobile) -->
<nav aria-label="Sidebar Navigation" class="fixed left-0 top-0 h-full w-[280px] z-[60] bg-primary-container shadow-xl flex flex-col py-6">
<!-- Header -->
<div class="px-6 mb-8 flex items-center gap-4">
<img alt="Setuu Mobile Sidebar Logo" class="w-12 h-12 rounded-md object-contain bg-surface" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAPCm5l_c24OvJ-YVFPgCPOYLPvdXhmyv99DbXQ0HnoeXwHLB9vguJ6Pi3zMKNFYSaMmAGFRzOjv4GJ-qoltfJOdOwQUNXT71_SYxQtmR-n80WTz3N5VzdBE5XJSJ7HgcC8-fmgxgovy3olp61Sw8zzXl8hJ4tjaavt-N8m4d5p3Yk3wFMKRQmYKQf9VMbilJnnMmcYIMw2LjIuxU_iijSDFOOoZ1dV54JEBhjVmRWCNTiDZitJEQy6">
<div>
<div class="font-headline font-bold text-on-primary-container text-headline-sm">Setuu Enterprise</div>
<div class="font-label text-label-sm text-on-primary-container/70 mt-1 uppercase tracking-wider">Admin Hub</div>
</div>
</div>
<!-- Scrollable Navigation Items -->
<div class="flex-1 overflow-y-auto">
<ul class="space-y-1">
<!-- Dashboard -->
<li>
<a class="flex items-center gap-3 text-on-primary-container/80 hover:text-on-primary-container px-4 py-3 mx-2 hover:bg-on-primary-container/10 rounded-lg transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:text-on-primary-container">dashboard</span>
<span class="font-body text-body-md font-medium">Dashboard</span>
</a>
</li>
<!-- Organizations -->
<li>
<a class="flex items-center gap-3 text-on-primary-container/80 hover:text-on-primary-container px-4 py-3 mx-2 hover:bg-on-primary-container/10 rounded-lg transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:text-on-primary-container">corporate_fare</span>
<span class="font-body text-body-md font-medium">Organizations</span>
</a>
</li>
<!-- Security Console -->
<li>
<a class="flex items-center gap-3 text-on-primary-container/80 hover:text-on-primary-container px-4 py-3 mx-2 hover:bg-on-primary-container/10 rounded-lg transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:text-on-primary-container">terminal</span>
<span class="font-body text-body-md font-medium">Security Console</span>
</a>
</li>
<!-- Audit Logs (Active) -->
<li>
<a aria-current="page" class="flex items-center gap-3 bg-secondary-container text-on-secondary-container rounded-lg px-4 py-3 mx-2 scale-[0.99] transition-transform shadow-sm" href="#">
<span class="material-symbols-outlined fill" style="font-variation-settings: 'FILL' 1;">history_edu</span>
<span class="font-body text-body-md font-semibold">Audit Logs</span>
</a>
</li>
<!-- Storage Quotas -->
<li>
<a class="flex items-center gap-3 text-on-primary-container/80 hover:text-on-primary-container px-4 py-3 mx-2 hover:bg-on-primary-container/10 rounded-lg transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:text-on-primary-container">database</span>
<span class="font-body text-body-md font-medium">Storage Quotas</span>
</a>
</li>
</ul>
</div>
<!-- Bottom Section -->
<div class="mt-auto px-4 pt-6 border-t border-on-primary-container/20">
<!-- System Health -->
<div class="flex items-center gap-2 mb-6 px-2">
<div class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary-container opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-secondary-container"></span>
</div>
<span class="font-label text-label-md text-on-primary-container uppercase tracking-wider">All Systems Go</span>
</div>
<!-- Action Button -->
<button class="w-full bg-secondary text-on-secondary py-3 px-4 rounded-lg flex items-center justify-center gap-2 font-body text-body-md font-semibold hover:bg-secondary/90 transition-colors shadow-sm">
<span class="material-symbols-outlined text-[20px]">add</span>
                Add Organization
            </button>
</div>
</nav>

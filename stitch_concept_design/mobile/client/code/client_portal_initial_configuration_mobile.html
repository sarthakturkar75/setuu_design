<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Setuu Enterprise - Client Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        /* Shimmer Effect for Skeletons */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }
        .skeleton-shimmer {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, #f5f4ef 4%, #e9e8e3 25%, #f5f4ef 36%);
            background-size: 1000px 100%;
        }

        /* Loading Dots */
        .loading-dots::after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f2f1ec",
                        "on-secondary-container": "#005a7f",
                        "on-secondary-fixed": "#001e2d",
                        "on-secondary-fixed-variant": "#004c6b",
                        "on-primary": "#ffffff",
                        "secondary": "#00658d",
                        "outline": "#73777e",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#0090c7",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#004c6b",
                        "inverse-primary": "#aec9eb",
                        "outline-variant": "#c3c6ce",
                        "surface-container-highest": "#e3e3de",
                        "surface": "#faf9f4",
                        "surface-container-low": "#f5f4ef",
                        "primary": "#000815",
                        "surface-bright": "#faf9f4",
                        "on-tertiary-fixed": "#001e2d",
                        "background": "#faf9f4",
                        "primary-fixed": "#d1e4ff",
                        "on-error-container": "#93000a",
                        "on-surface": "#1b1c19",
                        "primary-fixed-dim": "#aec9eb",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#c6e7ff",
                        "on-primary-fixed": "#001d35",
                        "surface-dim": "#dbdad5",
                        "on-background": "#1b1c19",
                        "surface-container-high": "#e9e8e3",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#6f89a9",
                        "on-surface-variant": "#43474d",
                        "secondary-fixed-dim": "#88cffc",
                        "on-error": "#ffffff",
                        "tertiary-container": "#002233",
                        "primary-container": "#00213c",
                        "secondary-fixed": "#c6e7ff",
                        "surface-container": "#efeee9",
                        "on-primary-fixed-variant": "#2e4965",
                        "inverse-surface": "#30312e",
                        "secondary-container": "#8ad1ff",
                        "surface-variant": "#e3e3de",
                        "surface-tint": "#46607e",
                        "tertiary": "#00080f",
                        "tertiary-fixed-dim": "#82cfff",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Merriweather"],
                        "display": ["Merriweather"],
                        "body": ["Inter"],
                        "label": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col pt-16 pb-20 selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm bg-surface/85 flex justify-between items-center px-4 h-16 transition-all duration-300">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant/50 flex items-center justify-center text-primary font-headline text-xs">
                CE
            </div>
<h1 class="font-headline font-bold text-primary text-headline-sm tracking-tight truncate">Setuu Enterprise</h1>
</div>
<button aria-label="Notifications" class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:bg-surface-container-high/50 active:scale-95 duration-200 transition-colors">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col p-4 space-y-6 max-w-lg mx-auto w-full">
<!-- Hero Configuration State -->
<section class="mt-4 text-center px-2 flex flex-col items-center">
<div class="w-24 h-24 mb-6 rounded-2xl bg-surface-container-lowest shadow-sm border border-outline-variant/50 flex items-center justify-center relative">
<!-- Abstract Blueprint Icon -->
<span class="material-symbols-outlined text-4xl text-primary" data-icon="architecture" data-weight="fill" style="font-variation-settings: 'FILL' 1;">architecture</span>
<!-- Pulsing indicator -->
<div class="absolute -top-1 -right-1 w-3 h-3 bg-secondary rounded-full animate-ping"></div>
<div class="absolute -top-1 -right-1 w-3 h-3 bg-secondary rounded-full"></div>
</div>
<h2 class="font-headline text-headline-md font-bold text-primary mb-3 leading-tight">Baseline Configuration in Progress</h2>
<p class="font-body text-body-md text-on-surface-variant max-w-[280px] leading-relaxed mx-auto">
                Your project baseline is being meticulously configured by our engineering team. Updates will appear here shortly.
            </p>
</section>
<!-- Skeleton KPIs -->
<section class="grid grid-cols-2 gap-4 mt-2">
<!-- KPI 1 Skeleton -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-outline-variant/30 flex flex-col gap-3">
<div class="w-8 h-8 rounded-md skeleton-shimmer bg-surface-container-low mb-2"></div>
<div class="h-3 w-16 skeleton-shimmer bg-surface-container-low rounded"></div>
<div class="h-6 w-24 skeleton-shimmer bg-surface-container-low rounded mt-1"></div>
</div>
<!-- KPI 2 Skeleton -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-outline-variant/30 flex flex-col gap-3">
<div class="w-8 h-8 rounded-md skeleton-shimmer bg-surface-container-low mb-2"></div>
<div class="h-3 w-20 skeleton-shimmer bg-surface-container-low rounded"></div>
<div class="h-6 w-20 skeleton-shimmer bg-surface-container-low rounded mt-1"></div>
</div>
</section>
<!-- Skeleton Map / Main Visual -->
<section class="mt-2 relative">
<div class="w-full h-48 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden relative">
<!-- Map Wireframe pattern (CSS) -->
<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#1b1c19 1px, transparent 1px); background-size: 12px 12px;"></div>
<!-- Scanning line effect -->
<div class="absolute top-0 left-0 w-full h-1 bg-secondary/30 blur-[2px] animate-[scan_3s_ease-in-out_infinite]"></div>
<div class="absolute inset-0 flex items-center justify-center flex-col gap-2 backdrop-blur-[1px]">
<span class="material-symbols-outlined text-outline-variant text-3xl opacity-50" data-icon="map">map</span>
<div class="h-2 w-32 skeleton-shimmer bg-surface-container-high rounded"></div>
</div>
</div>
<style>
                @keyframes scan {
                    0% { top: 0%; opacity: 0; }
                    10% { opacity: 1; }
                    90% { opacity: 1; }
                    100% { top: 100%; opacity: 0; }
                }
            </style>
</section>
<!-- Progress Log Skeleton -->
<section class="mt-4 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-4">
<div class="flex items-center justify-between mb-4">
<div class="h-4 w-24 skeleton-shimmer bg-surface-container-low rounded"></div>
<div class="h-3 w-12 skeleton-shimmer bg-surface-container-low rounded"></div>
</div>
<div class="space-y-4">
<div class="flex gap-3">
<div class="w-6 h-6 rounded-full skeleton-shimmer bg-surface-container-low flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-3/4 skeleton-shimmer bg-surface-container-low rounded"></div>
<div class="h-2 w-1/4 skeleton-shimmer bg-surface-container-low rounded"></div>
</div>
</div>
<div class="flex gap-3">
<div class="w-6 h-6 rounded-full skeleton-shimmer bg-surface-container-low flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-1/2 skeleton-shimmer bg-surface-container-low rounded"></div>
<div class="h-2 w-1/3 skeleton-shimmer bg-surface-container-low rounded"></div>
</div>
</div>
</div>
</section>
<!-- System Loading Text -->
<div class="mt-auto pt-6 text-center">
<p class="font-label text-label-sm text-outline tracking-widest uppercase flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[14px] animate-spin" data-icon="settings">settings</span>
<span class="loading-dots">SYSTEM INITIALIZING</span>
</p>
</div>
</main>
<!-- BottomNavBar -->
<!-- Displayed only on mobile via shell wrapper classes (assumed via prompt context, though responsive classes not explicitly required here, added for best practice) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 backdrop-blur-xl rounded-t-xl border-t border-outline-variant/30 shadow-lg bg-surface/85 flex justify-around items-center h-20 pb-safe px-2">
<!-- Active Tab: Portfolio -->
<button aria-label="Portfolio" class="flex flex-col items-center justify-center hover:text-primary active:scale-90 transition-transform group w-16">
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 mb-1 group-active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="dashboard" data-weight="fill" style="font-variation-settings: 'FILL' 1;">dashboard</span>
</div>
<span class="font-label text-label-sm text-primary font-bold">Portfolio</span>
</button>
<!-- Inactive Tab: Briefing -->
<button aria-label="Briefing" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform group w-16">
<div class="flex flex-col items-center justify-center rounded-full px-5 py-1 mb-1">
<span class="material-symbols-outlined" data-icon="description">description</span>
</div>
<span class="font-label text-label-sm">Briefing</span>
</button>
<!-- Inactive Tab: Financials -->
<button aria-label="Financials" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform group w-16">
<div class="flex flex-col items-center justify-center rounded-full px-5 py-1 mb-1">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
</div>
<span class="font-label text-label-sm">Financials</span>
</button>
<!-- Inactive Tab: Progress -->
<button aria-label="Progress" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform group w-16">
<div class="flex flex-col items-center justify-center rounded-full px-5 py-1 mb-1">
<span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
</div>
<span class="font-label text-label-sm">Progress</span>
</button>
</nav>
<!-- Safe area padding for newer iPhones -->
<style>
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</body></html>
